name: Kiosk Satellite Intercom Gateway
version: "0.1.0"
slug: ks_intercom_gateway
description: Rings Kiosk Satellite intercoms when an Asterisk/SIP account is called
url: https://github.com/meiser79/kiosk-satellite-intercom-gateway
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
host_network: true       # SIP/RTP and the kiosks' callbacks need the LAN address
ingress: true
ingress_port: 8099
panel_icon: mdi:phone-in-talk
panel_title: Intercom Gateway
map:
  - type: addon_config   # mounted at /config, holds config.json
    read_only: false
